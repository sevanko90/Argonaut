name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet publish Argonaut/Argonaut.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true         -p:InformationalVersion=${{ github.ref_name }}
      - name: Publish and pack (Windows, Velopack)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Rid ${{ matrix.rid }} -RawVersion "${{ github.event_name == 'release' && github.ref_name || '' }}"
      - name: Import signing certs + notary credentials
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
          xcrun notarytool store-credentials "argonaut-notary" \
            --key "$RUNNER_TEMP/notary_key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary_key.p8"
      - name: Publish and pack (macOS, Velopack)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 20
        run: ./scripts/package-macos.sh ${{ matrix.rid }} "${{ github.event_name == 'release' && github.ref_name || '' }}"
      - name: Remove build keychain
        if: always() && matrix.os == 'macos-latest'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
      - name: Collect binlog on failure
        if: failure()
        run: dotnet publish Argonaut/Argonaut.csproj -c Release -r ${{ matrix.rid }} /bl:publish-${{ matrix.rid }}.binlog
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'macos-latest'
        with:
          name: argonaut-${{ matrix.rid }}
          path: Argonaut/bin/Release/net10.0/${{ matrix.rid }}/publish
      - name: Zip .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Argonaut.app" "${{ github.workspace }}/argonaut-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: argonaut-${{ matrix.rid }}
          path: argonaut-${{ matrix.rid }}.zip
      - name: Zip publish output (Linux)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        shell: bash
        run: |
          cd Argonaut/bin/Release/net10.0/${{ matrix.rid }}/publish
          zip -r "${{ github.workspace }}/argonaut-${{ matrix.rid }}.zip" .
      - name: Zip publish output (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        shell: pwsh
        run: |
          $publishDir = Join-Path $Env:GITHUB_WORKSPACE "Argonaut\\bin\\Release\\net10.0\\${{ matrix.rid }}\\publish"
          $zipPath = Join-Path $Env:GITHUB_WORKSPACE "argonaut-${{ matrix.rid }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -Force
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: argonaut-${{ matrix.rid }}.zip
      - name: Attach Velopack assets to release
        if: github.event_name == 'release' && matrix.os != 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          # Only the installer, the update payload (.nupkg), and the feed manifest
          # (releases.{channel}.json) that UpdateManager actually reads are attached.
          # vpk also writes RELEASES*/assets.*.json (legacy Squirrel compat / vpk's own
          # local pack bookkeeping - neither read by GithubSource) and a portable .zip
          # (redundant with the plain zip already attached above) - none of those are
          # needed on the release itself.
          files: |
            dist/velopack/*.exe
            dist/velopack/*.pkg
            dist/velopack/*.nupkg
            dist/velopack/releases.*.json
      - name: Upload binlog
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-logs-${{ matrix.rid }}
          path: publish-${{ matrix.rid }}.binlog
