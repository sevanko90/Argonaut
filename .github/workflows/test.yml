name: Test

# The test suite on the two platforms the app ships to and that behave differently underneath it:
# Windows cannot replace a file while a mapping of it is open (saves), and macOS and Windows round
# a mapping's capacity differently (MMapFile). A pass on one says little about the other.
#
# A pull request that only changes the website or Markdown docs skips the suite: nothing it touches
# is built into the app. If this check is ever made required, move the filter inside the job
# instead - a workflow skipped by its paths never reports, and a required check would wait forever.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Add the Ksyrt feed
        # Ksyrt is restored from GitHub Packages, which needs a login even for a public package;
        # the workflow's own token reads it (packages: read, and the package's Actions access).
        shell: bash
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name ksyrt --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
      - name: Build
        run: dotnet build Argonaut.Tests/Argonaut.Tests.csproj -c Release
      - name: Test
        run: dotnet test Argonaut.Tests/Argonaut.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
