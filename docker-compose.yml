services:
  app:
    image: argonaut-dev-image:latest
    container_name: argonaut-app-container

    user: vscode

    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    working_dir: /workspace
    stdin_open: true
    tty: true

    volumes:
      # Maps your local files into the container
      - .:/workspace
      # NuGet's global packages cache lives in a named volume, not the bind
      # mount, so that:
      #  - restored packages never touch your host OS
      #  - Windows/WSL2 bind-mount performance isn't tanked by the cache
      #  - restored packages survive container rebuilds
      - argonaut-nuget:/home/vscode/.nuget/packages
      # X11 socket, so `dotnet run` can put a real Argonaut window on your
      # desktop when DISPLAY is set. Harmless (an empty dir) when it isn't.
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      # Unset by default: the container runs headless. Point it at an X server
      # to see the actual UI - see .env.example and .devcontainer/README.md.
      - DISPLAY

    # Argonaut opens multi-gigabyte files and builds in-memory indexes that can
    # exceed the file size. Docker Desktop's default VM memory is often too small
    # for that; raise it in Docker Desktop settings if the app gets OOM-killed.

    # docker-compose.yml is the source of truth for this environment: all
    # setup happens here, not in a devcontainer postCreateCommand, so the
    # exact same behavior applies whether you use VS Code or plain `docker
    # compose up`. Note that a `docker compose run`/`exec` command override
    # skips this block, so nothing here may be load-bearing for a shell
    # session - the volume ownership it used to fix lives in the Dockerfile.
    command: |
      bash -c "
      echo 'Restoring packages...';
      if ! dotnet restore Argonaut.slnx; then
        echo 'ERROR: dotnet restore failed. Aborting container startup.';
        exit 1;
      fi;

      echo '';
      echo 'Argonaut dev environment ready. It is a desktop app, so there is no';
      echo 'dev server to hand this terminal over to - the container idles instead.';
      echo 'Drive it from your host shell, no container shell needed:';
      echo '  docker compose run --rm app dotnet build Argonaut.slnx';
      echo '  docker compose run --rm app dotnet test Argonaut.Tests/Argonaut.Tests.csproj';
      echo 'See .devcontainer/README.md for publishing a binary you can run natively.';
      echo '';
      exec ${DEV_COMMAND:-sleep infinity}
      "

volumes:
  argonaut-nuget:
